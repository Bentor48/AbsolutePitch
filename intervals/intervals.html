<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intervals</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="styleForIntervals.css">
    <link rel="icon" href="../icon/favicon.png">
    <link rel="icon" type="image/svg+xml" href="../icon/favicon.svg">
    <link rel="apple-touch-icon" href="../icon/apple-touch-icon.png">
    <meta name="author" content="Mikhail Poltavsky">
    <meta
    name="description"
    content="Train your musical ear by guessing played notes. Available in English, Ukrainian and Russian.">
    <meta name="theme-color" content="#000f58">
<body>
    <script src="../dictionary.js"></script>

    <header>
        <a href="../index.html"><img id="logo" src="../image/LogoAPLight.svg" alt="Логотип"></a>
    </header>

    <main>
        <div id="settings-container"></div>

        <div class="conteiner">
            <div id="conteinerSlider">
                <div class="slider-track" id="sliderTrack"></div>
                <div class="slider-thumb" id="sliderThumb"></div>

                <span class="step left p1"></span>
                <span class="step right p1"></span>
                <span class="step left p2"></span>
                <span class="step right p2"></span>
                <span class="step left p3"></span>
                <span class="step right p3"></span>
                <span class="step left p4"></span>
                <span class="step right p4"></span>
                <span class="step left p5"></span>
                <span class="step right p5"></span>
                <span class="step left p6"></span>
                <span class="step right p6"></span>
                <span class="step left p7"></span>
                <span class="step right p7"></span>
                <span class="step left p8"></span>
                <span class="step right p8"></span>
                <span class="step left p9"></span>
                <span class="step right p9"></span>
                <span class="step left p10" ></span>
                <span class="step right p10"></span>
                <span class="step left p11"></span>
                <span class="step right p11"></span>
                <span class="step left p12"></span>
                <span class="step right p12"></span>
                <span class="step left p13"></span>
                <span class="step right p13"></span>
                
                <p class="pIntervalsName" id="p13t">Октава</p>
                <p class="pIntervalsName" id="p12t">Септима большая</p>
                <p class="pIntervalsName" id="p11t">Септима малая</p>
                <p class="pIntervalsName" id="p10t">Секста большая</p>
                <p class="pIntervalsName" id="p9t">Секста малая</p>
                <p class="pIntervalsName" id="p8t">Квинта</p>
                <p class="pIntervalsName" id="p7t">Тритон</p>
                <p class="pIntervalsName" id="p6t">Кварта</p>
                <p class="pIntervalsName" id="p5t">Терция большая</p>
                <p class="pIntervalsName" id="p4t">Терция малая</p>
                <p class="pIntervalsName" id="p3t">Секунда большая</p>
                <p class="pIntervalsName" id="p2t">Секунда малая</p>
                <p class="pIntervalsName" id="p1t">Прима</p>
            </div>
        </div>
    </main>

    <footer></footer>
    <script src="../scriptSetting.js"></script>
    <script src="scriptForIntervals.js"></script>
</body>
</html>

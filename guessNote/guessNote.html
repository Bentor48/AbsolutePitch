<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="styleGuessNote.css">
    <title>Guess the note</title>
    <link rel="icon" href="../icon/favicon.png">
    <link rel="icon" type="image/svg+xml" href="../icon/favicon.svg">
    <link rel="apple-touch-icon" href="../icon/apple-touch-icon.png">
    <meta name="author" content="Mikhail Poltavsky">
    <meta
    name="description"
    content="Train your musical ear by guessing played notes. Available in English, Ukrainian and Russian.">
    <meta name="theme-color" content="#000f58">
</head>
<body>
    <script src="../dictionary.js"></script>

    <header>
        <a href="../index.html"><img id="logo" src="../image/LogoAPLight.svg" alt="Логотип"></a>
    </header>

    <main>
        <div id="window1ForStart" class="fullWindow1">
            <div id="settings-container"></div>

            <h1 id="welcome-containerh1" class="containerh1">Угадай<br>ноту</h1>
            <p id="welcome-containerp" class="containerp">После нажатия на кнопку "Начать" вы услышите звук ноты. Ваша задача - угадать, какая нота была сыграна. Также вы можете настроить длительность воспроизведения.</p>

            <div id="noteA-container">
                <label class="labelForWelcome" id="noteALabel" for="noteA">Услышать ноту Ля(А)</label>
                <input type="checkbox" id="noteA"></input>
            </div>

            <div id="counter-container">
                <label class="labelForWelcome" for="counter" id="counter-label"><span id="counterText">Длительность воспроизведения: </span><span> <span id="counter-value">2</span> <span id="counterNameTime">сек</span></label>
                <input type="range" id="counter" name="counter" min="1" max="4" value="2" step="1">
            </div>

            <button class="buttonForContine" id="start-btn">Начать</button>
        </div>

        <div id="window2ForTimer" class="fullWindow1" style="display: none;">
            <img id="svgForStart" alt="Человек внимательно слушает музыку" src="../image/ListenLight.svg">
            <p id="timer">3</p>
        </div>

        <div id="window3ForPiano" class="fullWindow1">
            <dialog id="unselectedNote">
                <p id="unselectedNoteText"></p>
            </dialog>

            <div id="fortepiano">
                <button class="note-btn white-btn" id="si" data-note="11">Си</button>
                <button class="note-btn black-btn" id="si-flat" data-note="10">Ля#/Си♭</button>
                <button class="note-btn white-btn" id="la" data-note="9">Ля</button>
                <button class="note-btn black-btn" id="sol-sharp" data-note="8">Соль#/Ля♭</button>
                <button class="note-btn white-btn" id="sol" data-note="7">Соль</button>
                <button class="note-btn black-btn" id="fa-sharp" data-note="6">Фа#/Соль♭</button>
                <button class="note-btn white-btn" id="fa" data-note="5">Фа</button>
                <button class="note-btn white-btn" id="mi" data-note="4">Ми</button>
                <button class="note-btn black-btn" id="mi-flat" data-note="3">Ре#/Ми♭</button>
                <button class="note-btn white-btn" id="re" data-note="2">Ре</button>
                <button class="note-btn black-btn" id="do-sharp" data-note="1">До#/Ре♭</button>
                <button class="note-btn white-btn" id="do" data-note="0">До</button>
            </div>

            <button id="resultButton" class="buttonForContine">Проверить</button>
        </div>

        <div id="window4ForResult" class="fullWindow1 resultWindowForNote">
            <h1 id="correctNote" class="containerh1 correctNoteScore"></h1>
            <p id="textForResult" class="containerp textForResult"></p>
            <button id="restartBNT" class="buttonForContine restartBNT">Продолжить</button>
        </div>

        <div id="window5ForFullResult" class="fullWindow1 resultWindowForNote">
            <h1 id="fullResult" class="containerh1 correctNoteScore"><span id="score">0</span>/5</h1>
            <p id="motivationResults" class="containerp textForResult">Мотивирующая фраза, итог. Вывод.</p>
            <button id="restartHtmlBNT" class="buttonForContine restartBNT">Попробовать ещё раз</button>
        </div>
    </main>
    <footer></footer>
    <script src="../scriptSetting.js"></script>
    <script src="scriptGuessNote.js"></script>
</body>
</html>
